name: Build Unciv Unsigned IPA

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build unsigned arm64 IPA
        run: ./gradlew ios:createIPA -Probovm.arch=arm64 -Probovm.iosSkipSigning=true

      - name: Package IPA artifact
        run: |
          mkdir -p release_ipa
          IPA_FILE=$(find ios/build -name "*.ipa" | head -n 1)
          if [ -n "$IPA_FILE" ]; then
            cp "$IPA_FILE" release_ipa/Unciv-iOS-Unsigned.ipa
          else
            APP_DIR=$(find ios/build -name "*.app" | head -n 1)
            mkdir -p Payload
            cp -R "$APP_DIR" Payload/
            zip -r release_ipa/Unciv-iOS-Unsigned.ipa Payload
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unciv-iOS-Unsigned
          path: release_ipa/Unciv-iOS-Unsigned.ipa
