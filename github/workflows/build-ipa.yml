name: Build Unciv Unsigned IPA

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Rebuilds automatically every Sunday

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build unsigned arm64 IPA
        run: ./gradlew ios:createIPA -Probovm.arch=arm64 -Probovm.iosSkipSigning=true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unciv-iOS-Unsigned
          path: ios/build/robovm/*.ipa
